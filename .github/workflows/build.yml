name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -q TikTokLinkPicker.zip

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          build-root-directory: TikTokLinkPicker

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
        working-directory: TikTokLinkPicker

      - uses: actions/upload-artifact@v4
        with:
          name: TikTokLinkPicker-apk
          path: TikTokLinkPicker/app/build/outputs/apk/debug/app-debug.apk
